<svg width="600" height="200" viewBox="0 0 600 200" xmlns="http://www.w3.org/2000/svg" style="background:black">
<!--kometa-->
  <g>
    <circle cx="0" cy="100" r="30" fill="red"/>
    <circle cx="0" cy="100" r="18" fill="orange"/>
    <animateTransform attributeName="transform" type="translate" from="0 0" to="700 0" dur="2.5s" repeatCount="indefinite"/>
  </g>
<!--ogon komety-->
  <g>
    <rect x="-100" y="85" width="80" height="30" rx="15" fill="red"/>
    <animateTransform attributeName="transform" type="translate" from="0 0" to="700 0" dur="2.5s" repeatCount="indefinite"/>
  </g>
  <g>
    <rect x="-80" y="70" width="60" height="60" rx="15" fill="red"/>
    <animateTransform attributeName="transform" type="translate" from="0 0" to="700 0" dur="2.5s" repeatCount="indefinite"/>
  </g>
  <g>
    <rect x="-60" y="85" width="60" height="30" rx="15" fill="orange"/>
    <animateTransform attributeName="transform" type="translate" from="0 0" to="700 0" dur="2.5s" repeatCount="indefinite"/>
  </g>
<!--drobinki za kometą-->
  <g opacity="0.9">
    <rect x="-200" y="92" width="60" height="16" rx="8" fill="red">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="700 0" dur="2.5s" begin="0.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" from="1" to="0" dur="2.5s" begin="0.2s" repeatCount="indefinite"/>
    </rect>
    <rect x="-260" y="96" width="40" height="10" rx="5" fill="orange">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="700 0" dur="2.5s" begin="0.35s" repeatCount="indefinite"/>
      <animate attributeName="opacity" from="1" to="0" dur="2.5s" begin="0.35s" repeatCount="indefinite"/>
    </rect>
    <rect x="-310" y="98" width="25" height="6" rx="3" fill="yellow">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="700 0" dur="2.5s" begin="0.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" from="1" to="0" dur="2.5s" begin="0.5s" repeatCount="indefinite"/>
    </rect>
  </g>
  <g>
    <rect x="-180" y="70" width="10" height="4" rx="2" fill="yellow">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="700 0" dur="2.5s" begin="0.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" from="1" to="0" dur="2.5s" begin="0.6s" repeatCount="indefinite"/>
    </rect>
    <rect x="-220" y="120" width="12" height="5" rx="2" fill="orange">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="700 0" dur="2.5s" begin="0.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" from="1" to="0" dur="2.5s" begin="0.8s" repeatCount="indefinite"/>
    </rect>
    <rect x="-260" y="80" width="8" height="3" rx="2" fill="yellow">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="700 0" dur="2.5s" begin="1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" from="1" to="0" dur="2.5s" begin="1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
