<svg width="600" height="600" viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg" fill="none">

    <symbol id="triangle" transform="rotate(0)" overflow="visible" stroke="black">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="2s" repeatCount="indefinite" />
        <polygon id="triangle" points="0,-30 30,30 -30,30" fill="none" stroke="black"/>
    </symbol>
    <symbol id="windmill" viewBox="0 0 600 600">
        <g transform="translate(450,80)">
            <g transform="translate(0,150) rotate(20)">
            <!--obracające sie trójkąty-->
                <use href="#triangle" transform="translate(95,0)" />
                <use href="#triangle" transform="translate(-95,0)" />
                <!--belka-->
                <rect x="-100" y="-10" width="200" height="12" fill="red" />
            </g>
            <polygon
                points="-30,300 30,300 0,150"
                fill="var(--colour)"/>
        </g>
    </symbol>
    <use href="#windmill" style="--colour:purple" x="-200" y="-90" width="400" height="400" />
    <use href="#windmill" style="--colour:blue" x="-125" y="0" width="600" height="450" />
    <use href="#windmill" style="--colour:green" x="150" y="-20" width="450" height="300" />
</svg>
