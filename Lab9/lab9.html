<!DOCTYPE html>
<html lang="pl">
<!--
    Kontrolki:
    1 - suma
    2 - przecięcie
    3 - różnica  
-->
<head>
    <meta charset="UTF-8">
    <title>Raymarching</title>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: black;
        }

        button {
            position: relative;
            z-index: 10;
            margin: 5px;
            padding: 10px;
        }
    </style>
</head>

<body>
<button onclick="setMode(0)">Suma</button>
<button onclick="setMode(1)">Przecięcie</button>
<button onclick="setMode(2)">Różnica</button>
    <script type="importmap">
{
  "imports": {
    "three": "https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
const scene = new THREE.Scene();
const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const renderer = new THREE.WebGLRenderer();
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

const vertexShader = `
void main() {
gl_Position = vec4(position, 1.0);
}`;

const fragmentShader = `
uniform vec2 u_resolution;
uniform float u_time;
uniform int u_mode;

float sdCircle(vec2 p, float r) {
    return length(p) - r;
}

float sdTriangle(vec2 p, float size) {

    p.x = abs(p.x);

    return max(
        p.x * 0.866025 + p.y * 0.5,
        -p.y
    ) - size * 0.5;
}

void main() {

    vec2 uv = (gl_FragCoord.xy - 0.5 * u_resolution) / u_resolution.y;

    vec2 circlePos = vec2(
        sin(u_time * 0.8) * 0.55,
        cos(u_time * 1.2) * 0.20
    );

    vec2 pCircle = uv - circlePos;

    float noise =
        sin(pCircle.x * 18.0 + u_time * 1.5) *
        sin(pCircle.y * 12.0 + u_time);

    float radius = 0.30 + noise * 0.035;

    float circle = sdCircle(pCircle, radius);

    vec2 pTriangle = uv;

    float pulse =
        0.55 +
        sin(u_time * 2.5) * 0.18;

    float triangle = sdTriangle(pTriangle, pulse);

    float d;

    if(u_mode == 0)
        d = min(circle, triangle);

    else if(u_mode == 1)
        d = max(circle, triangle);

    else
        d = max(circle, -triangle);

    vec3 circleColor   = vec3(1.0, 0.45, 0.25);
    vec3 triangleColor = vec3(0.2, 0.8, 1.0);

    vec3 bgColor = vec3(0.05, 0.05, 0.08);

    vec3 col = bgColor;

    bool insideCircle = circle < 0.0;
    bool insideTriangle = triangle < 0.0;

    if(u_mode == 0) {

        if(insideCircle && insideTriangle)
            col = mix(circleColor, triangleColor, 0.5);

        else if(insideCircle)
            col = circleColor;

        else if(insideTriangle)
            col = triangleColor;
    }
    else if(u_mode == 1) {

        if(insideCircle && insideTriangle)
            col = mix(circleColor, triangleColor, 0.5);
    }
    else {

        if(insideCircle && !insideTriangle)
            col = circleColor;
    }

    gl_FragColor = vec4(col, 1.0);
}`;

const material = new THREE.ShaderMaterial({
    vertexShader,
    fragmentShader,

    uniforms: {
        u_resolution: {
        value: new THREE.Vector2(
        window.innerWidth,
        window.innerHeight
        )
        },
    u_time: { value: 0 },
    u_mode: { value: 0 }
    }
    });

    const mesh = new THREE.Mesh(
        new THREE.PlaneGeometry(2, 2),
        material
    );
    scene.add(mesh);

    window.setMode = (m) => {
        material.uniforms.u_mode.value = m;
    };
    function animate(t) {
        material.uniforms.u_time.value = t * 0.001;
        renderer.render(scene, camera);
        requestAnimationFrame(animate);
    }
    animate();

    </script>
</body>

</html>
