<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <title>CS 424 Lab 9</title>
    <script src="https://cdn.jsdelivr.net/npm/three@0.115/build/three.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.115/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.115/examples/js/loaders/GLTFLoader.js"></script>
    <script>

        "use strict";

        var canvas, renderer, scene, camera;

        var controls;

        var animating = false;
        var frameNumber = 0;

        var base;
        var pole1, pole2, pole3;
        var pivot1, pivot2, pivot3;
        var ceiling;
        var ceiling2;
        var horseModel;

        function render() {
            renderer.render(scene, camera);
        }

        function createWorld() {

            renderer.setClearColor("white");
            scene = new THREE.Scene();

            camera = new THREE.PerspectiveCamera(30, canvas.width / canvas.height, 0.1, 100);
            camera.position.z = 40;
            camera.position.y = 20;

            var light;
            light = new THREE.DirectionalLight();
            light.position.set(0, 0, 1);
            camera.add(light);
            scene.add(camera);

            base = new THREE.Mesh(
                new THREE.CylinderGeometry(13.5, 13.5, 0.6, 3, 1),
                new THREE.MeshPhongMaterial({
                    color: 0x331c84,
                    specular: 0x222222,
                    shininess: 16,
                    shading: THREE.FlatShading
                })
            );
            base.rotation.y = Math.PI / 6;
            scene.add(base);

            pole1 = new THREE.Mesh(
                new THREE.CylinderGeometry(0.3, 0.3, 7.5, 30, 1),
                new THREE.MeshPhongMaterial({
                    color: 0x7c5426,
                    specular: 0x222222,
                    shininess: 8,
                    shading: THREE.FlatShading
                })
            );
            pole1.position.set(0, 4, 6.5);
            scene.add(pole1);

            pole2 = new THREE.Mesh(
                new THREE.CylinderGeometry(0.3, 0.3, 7.5, 30, 1),
                new THREE.MeshPhongMaterial({
                    color: 0x7c5426,
                    specular: 0x222222,
                    shininess: 8,
                    shading: THREE.FlatShading
                })
            );
            pole2.position.set(-5.5, 4, -3.5);
            scene.add(pole2);

            pole3 = new THREE.Mesh(
                new THREE.CylinderGeometry(0.3, 0.3, 7.5, 30, 1),
                new THREE.MeshPhongMaterial({
                    color: 0x7c5426,
                    specular: 0x222222,
                    shininess: 8,
                    shading: THREE.FlatShading
                })
            );
            pole3.position.set(5.5, 4, -3.5);
            scene.add(pole3);

            ceiling = new THREE.Mesh(
                new THREE.CylinderGeometry(0, 13.4, 3, 3, 1, true),
                new THREE.MeshPhongMaterial({
                    color: 0x441c84,
                    specular: 0x222222,
                    shininess: 8,
                    shading: THREE.FlatShading
                })
            );
            ceiling.position.y = 9.1;
            ceiling.rotation.y = (Math.PI / 6);
            scene.add(ceiling);

            ceiling2 = new THREE.Mesh(
                new THREE.CylinderGeometry(13.1, 13.1, 0.3, 3, 1),
                new THREE.MeshPhongMaterial({
                    color: 0x441c84,
                    specular: 0x222222,
                    shininess: 8,
                    shading: THREE.FlatShading
                })
            );
            ceiling2.position.y = 7.5;
            ceiling2.rotation.y = (Math.PI / 6);
            scene.add(ceiling2);

            var loader = new THREE.GLTFLoader();

            pivot1 = new THREE.Group();
            pivot2 = new THREE.Group();
            pivot3 = new THREE.Group();

            scene.add(pivot1);
            scene.add(pivot2);
            scene.add(pivot3);

            pivot1.add(pole1);
            pivot2.add(pole2);
            pivot3.add(pole3);

            loader.load('https://threejs.org/examples/models/gltf/Horse.glb', function (gltf) {
                horseModel = gltf.scene;
                horseModel.scale.multiplyScalar(0.03);

                var h1 = horseModel.clone();
                h1.position.set(0, 1, 6.5);
                h1.rotation.y = 20;
                pivot1.add(h1);

                var h2 = horseModel.clone();
                h2.position.set(-5.5, 1, -3.5);
                h2.rotation.y = 40;
                pivot2.add(h2);

                var h3 = horseModel.clone();
                h3.position.set(5.5, 1, -3.5);
                h3.rotation.y = 60;
                pivot3.add(h3);
            });

        }

        function updateForFrame() {

            base.rotation.y += 0.01;
            ceiling.rotation.y += 0.01;
            ceiling2.rotation.y += 0.01;

            pivot1.rotation.y += 0.01;
            pivot2.rotation.y += 0.01;
            pivot3.rotation.y += 0.01;

        }

        function installOrbitControls() {
            controls = new THREE.OrbitControls(camera, canvas);
            controls.noPan = true;
            controls.noZoom = true;
            controls.staticMoving = true;
            function move() {
                controls.update();
                if (!animating) {
                    render();
                }
            }
            function down() {
                document.addEventListener("mousemove", move, false);
            }
            function up() {
                document.removeEventListener("mousemove", move, false);
            }
            function touch(event) {
                if (event.touches.length == 1) {
                    move();
                }
            }
            canvas.addEventListener("mousedown", down, false);
            canvas.addEventListener("touchmove", touch, false);
        }

        function doAnimateCheckbox() {
            var run = document.getElementById("animateCheckbox").checked;
            if (run != animating) {
                animating = run;
                if (animating) {
                    requestAnimationFrame(doFrame);
                }
            }
        }

        function doFrame() {
            if (animating) {
                frameNumber++;
                updateForFrame();
                render();
                requestAnimationFrame(doFrame);
            }
        }

        function init() {
            try {
                canvas = document.getElementById("glcanvas");
                renderer = new THREE.WebGLRenderer({
                    canvas: canvas,
                    antialias: true,
                    alpha: false
                });
            }
            catch (e) {
                document.getElementById("message").innerHTML = "<b>Sorry, an error occurred:<br>" +
                    e + "</b>";
                return;
            }
            document.getElementById("animateCheckbox").checked = false;
            document.getElementById("animateCheckbox").onchange = doAnimateCheckbox;
            createWorld();
            installOrbitControls();
            render();
        }

    </script>
</head>

<body onload="init()">

    <h2>Three.js Modeling Demo: Merry-Go-Round</h2>

    <p style="color:#AA0000; font-weight: bold" id="message">
    </p>

    <p>
        <label><input type="checkbox" id="animateCheckbox"><b>Animate</b></label>
        <b style="margin-left:50px">Use the mouse to rotate the model.</b>
    </p>

    <div id="canvas-holder" style="float:left; border: thin solid black; background-color: white">
        <canvas width=1200 height=600 id="glcanvas"></canvas>
    </div>

</body>

</html>
