<!DOCTYPE html>
<html lang="pl">

<head>
  <meta charset="UTF-8">
  <title>Rook</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #e8edf2;
    }
  </style>
</head>

<body>

  <script src="https://cdn.jsdelivr.net/npm/three@0.115/build/three.js"></script>

  <script>
    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 3, 12);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setClearColor(0xe8edf2);
    document.body.appendChild(renderer.domElement);

    const light1 = new THREE.DirectionalLight(0xffffff, 1);
    light1.position.set(5, 10, 5);
    scene.add(light1);

    const light2 = new THREE.DirectionalLight(0xffffff, 0.5);
    light2.position.set(-5, 5, -5);
    scene.add(light2);

    scene.add(new THREE.AmbientLight(0x888888));

    const points = [

      new THREE.Vector2(0, 0),

      new THREE.Vector2(2.5, 0),
      new THREE.Vector2(2.6, 0.25),
      new THREE.Vector2(2.4, 0.5),

      new THREE.Vector2(2.3, 0.7),
      new THREE.Vector2(2.3, 0.95),
      new THREE.Vector2(2.3, 1.05),

      new THREE.Vector2(1.9, 1.6),

      new THREE.Vector2(1.6, 2.4),
      new THREE.Vector2(1.5, 5.5),

      new THREE.Vector2(1.9, 4.8),
      new THREE.Vector2(2.0, 5.0),
      new THREE.Vector2(2.0, 5.4),
      new THREE.Vector2(1.9, 5.5),

      new THREE.Vector2(2.3, 5.6),
      new THREE.Vector2(2.4, 6.3),
      new THREE.Vector2(2.5, 6.6),

      new THREE.Vector2(0, 6.6)
    ];

    const geometry = new THREE.LatheGeometry(points, 80);

    const material = new THREE.MeshStandardMaterial({
      color: 0x2b2b2b,
      metalness: 0.5,
      roughness: 0.25
    });

    const rook = new THREE.Mesh(geometry, material);
    scene.add(rook);

    renderer.render(scene, camera);

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.render(scene, camera);
    });
  </script>

</body>

</html>
